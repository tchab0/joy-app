<style>
  /* Full-viewport mobile chat shell (standalone salon only) */
  body:has(.chat-room:not(.chat-room--embedded)) nav { position: sticky; top: 0; z-index: 20; }
  body:has(.chat-room:not(.chat-room--embedded)) footer { display: none; }
  body:has(.chat-room:not(.chat-room--embedded)) main { padding: 0; }

  .chat-room {
    --composer-h: 7.5rem;
    --keyboard-inset: 0px;
    max-width: 720px;
    margin: 0 auto;
    height: calc(100dvh - 56px);
    max-height: calc(100dvh - 56px);
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    position: relative;
    overflow: hidden;
  }

  .chat-room__bar {
    flex-shrink: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: .55rem .75rem;
    padding-left: max(.75rem, env(safe-area-inset-left));
    padding-right: max(.75rem, env(safe-area-inset-right));
    display: flex;
    gap: .5rem;
    align-items: center;
    min-height: 52px;
  }
  .chat-room__back {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    border-radius: var(--r);
    color: var(--accent);
    text-decoration: none;
    font-size: 1.25rem;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-room__titles { flex: 1; min-width: 0; }
  .chat-room__titles h1 {
    font-family: var(--font-d);
    font-size: 1.05rem;
    margin: 0;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-room__sub {
    margin: 0;
    font-size: .7rem;
    color: var(--muted);
  }
  .chat-room__embed-title {
    font-family: var(--font-d);
    font-size: 1.05rem;
    margin: 0;
    padding: .75rem 1rem .35rem;
    color: var(--text);
  }

  .chat-menu { position: relative; flex-shrink: 0; }
  .chat-menu__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    border-radius: var(--r);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
  }
  .chat-menu__panel {
    position: absolute;
    right: 0;
    top: calc(100% + .35rem);
    min-width: 13.5rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--r);
    box-shadow: 0 8px 24px rgba(26, 23, 20, .12);
    padding: .35rem;
    z-index: 30;
  }
  .chat-menu__panel form { margin: 0; }
  .chat-menu__item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 44px;
    padding: .55rem .75rem;
    border: 0;
    border-radius: calc(var(--r) - 2px);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: .95rem;
    text-align: left;
    cursor: pointer;
  }
  .chat-menu__item:active { background: rgba(var(--accent-rgb), .08); }
  .chat-menu__item--warn { color: var(--accent); font-weight: 600; }
  .chat-menu__item--ok { color: var(--ok); }

  .chat-event-intro {
    flex-shrink: 0;
    margin: 0;
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .chat-event-intro__type {
    margin: 0 0 .25rem;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .chat-event-intro__list {
    margin: 0;
    padding: 0;
    display: grid;
    gap: .3rem;
  }
  .chat-event-intro__list > div {
    display: grid;
    grid-template-columns: 4.5rem 1fr;
    gap: .35rem .5rem;
    font-size: .82rem;
    align-items: baseline;
  }
  .chat-event-intro__list dt {
    margin: 0;
    color: var(--muted);
    font-weight: 600;
    font-size: .7rem;
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .chat-event-intro__list dd { margin: 0; color: var(--text); }
  .chat-event-intro__link {
    display: inline-flex;
    align-items: center;
    min-height: 2.5rem;
    margin-top: .35rem;
    color: var(--accent);
    font-weight: 600;
    font-size: .85rem;
    text-decoration: none;
  }
  .chat-event-intro__link:hover { text-decoration: underline; }

  .chat-piece-intro {
    flex-shrink: 0;
    margin: 0;
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .chat-piece-intro h2 {
    margin: 0 0 .4rem;
    font-family: var(--font-d);
    font-size: 1rem;
    color: var(--text);
  }
  .chat-piece-intro p,
  .chat-piece-intro pre {
    margin: 0;
    font-size: .85rem;
    white-space: pre-wrap;
    line-height: 1.4;
    color: var(--text);
    font-family: var(--font-b);
  }
  .chat-piece-intro__link {
    display: inline-flex;
    align-items: center;
    min-height: 2.5rem;
    margin-top: .35rem;
    color: var(--accent);
    font-weight: 600;
    font-size: .85rem;
    text-decoration: none;
  }
  .chat-piece-intro__link:hover { text-decoration: underline; }
  .chat-piece-intro__media {
    margin: 0 0 .65rem;
  }
  .chat-piece-intro__media > p {
    margin: 0 0 .35rem;
  }
  .chat-piece-intro__audio {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 2.75rem;
    margin: 0;
  }
  /* Vignettes YouTube : styles dans repertoire/_styles.html (.rep-yt-*) */

  .chat-leave-hint {
    flex-shrink: 0;
    margin: 0;
    padding: .85rem 1rem;
    border-bottom: 1px solid rgba(var(--accent-rgb), .35);
    background: rgba(var(--accent-rgb), .1);
    color: var(--text);
    font-size: .92rem;
    line-height: 1.4;
  }
  .chat-leave-hint strong { color: var(--accent); display: block; margin-bottom: .2rem; font-size: 1rem; }
  .chat-leave-hint .chat-leave-cta {
    display: flex;
    margin-top: .65rem;
  }
  .chat-leave-hint button {
    flex: 1;
    min-height: 44px;
    border-radius: var(--r);
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .chat-status {
    flex-shrink: 0;
    font-size: .72rem;
    color: var(--muted);
    padding: .25rem 1rem 0;
  }
  .chat-status.is-live { color: var(--ok); }
  .chat-status.is-err { color: var(--accent); }

  .chat-thread {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: .75rem 1rem .75rem 2.35rem;
    padding-bottom: calc(var(--composer-h) + .75rem);
    display: flex;
    flex-direction: column;
    gap: .65rem;
  }
  .chat-msg {
    max-width: 88%;
    padding: .7rem .85rem;
    border-radius: var(--r);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    position: relative;
  }
  .chat-msg--mine {
    align-self: flex-end;
    border-color: rgba(var(--accent-rgb), .35);
    background: rgba(var(--accent-rgb), .07);
  }
  .chat-msg__meta {
    display: flex;
    align-items: center;
    gap: .35rem .5rem;
    flex-wrap: wrap;
    font-size: .72rem;
    color: var(--muted);
    margin: 0 0 .3rem;
    line-height: 1.3;
  }
  .chat-msg__meta-info { min-width: 0; flex: 1; }
  .chat-msg__body { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: .98rem; line-height: 1.4; color: var(--text); }
  .chat-msg__body--deleted { color: var(--muted); font-style: italic; }
  .chat-msg__body strong { font-weight: 700; color: inherit; }
  .chat-msg__body em { font-style: italic; color: inherit; }
  .chat-msg__body a.chat-msg__link {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: .12em;
    word-break: break-word;
  }
  .chat-msg__body a.chat-msg__link:hover,
  .chat-msg__body a.chat-msg__link:focus-visible {
    color: var(--accent-h, var(--accent));
  }
  .chat-msg__cite,
  .chat-msg__body blockquote,
  .chat-composer__editor blockquote {
    display: block;
    margin: .35rem 0;
    padding: .45rem .65rem;
    border: 0;
    border-left: 3px solid var(--gold-text, #8a6a1a);
    border-radius: 0 calc(var(--r) - 2px) calc(var(--r) - 2px) 0;
    background: rgba(138, 106, 26, .08);
    color: var(--text);
    font-style: italic;
    line-height: 1.4;
  }
  .chat-msg__cite:first-child,
  .chat-msg__body blockquote:first-child,
  .chat-composer__editor blockquote:first-child { margin-top: 0; }
  .chat-msg__cite:last-child,
  .chat-msg__body blockquote:last-child,
  .chat-composer__editor blockquote:last-child { margin-bottom: 0; }
  .chat-msg__cite strong,
  .chat-msg__body blockquote strong,
  .chat-composer__editor blockquote strong { font-style: normal; }
  .chat-msg__cite a.chat-msg__link,
  .chat-msg__body blockquote a.chat-msg__link { font-style: normal; }
  .chat-msg__list,
  .chat-msg__body ul,
  .chat-composer__editor ul {
    display: block;
    margin: .35rem 0;
    padding: 0 0 0 1.25rem;
    list-style: disc;
    list-style-position: outside;
    white-space: normal;
    color: var(--text);
  }
  .chat-msg__list:first-child,
  .chat-msg__body ul:first-child,
  .chat-composer__editor ul:first-child { margin-top: 0; }
  .chat-msg__list:last-child,
  .chat-msg__body ul:last-child,
  .chat-composer__editor ul:last-child { margin-bottom: 0; }
  .chat-msg__list li,
  .chat-msg__body ul li,
  .chat-composer__editor ul li {
    margin: .15rem 0;
    padding: 0;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }
  .chat-mention-tag {
    color: var(--accent);
    font-weight: 600;
  }
  .chat-msg__edited {
    font-style: italic;
    color: var(--muted);
  }
  .chat-msg__reads {
    position: relative;
    margin: .4rem 0 0;
  }
  .chat-msg__reads-btn {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    min-height: 44px;
    max-width: 100%;
    margin: 0;
    padding: .2rem 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: .72rem;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-msg__reads-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }
  .chat-msg__reads-checks {
    color: var(--ok);
    font-size: .78rem;
    letter-spacing: -.12em;
    flex-shrink: 0;
  }
  .chat-msg__reads-list {
    list-style: none;
    margin: .15rem 0 0;
    padding: .45rem .65rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--r);
    box-shadow: 0 6px 18px rgba(26, 23, 20, .1);
    font-size: .78rem;
    line-height: 1.35;
    max-height: 10rem;
    overflow-y: auto;
    z-index: 4;
  }
  .chat-msg__reads-list li {
    margin: 0;
    padding: .2rem 0;
    color: var(--text);
  }
  .chat-composer__input-wrap {
    position: relative;
  }
  .chat-mention {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(100% + .35rem);
    max-height: 14rem;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--r);
    box-shadow: 0 8px 24px rgba(26, 23, 20, .12);
    z-index: 45;
    padding: .25rem;
  }
  .chat-mention__hint {
    margin: 0;
    padding: .75rem;
    font-size: .85rem;
    color: var(--muted);
  }
  .chat-mention__item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .1rem;
    width: 100%;
    min-height: 44px;
    padding: .45rem .65rem;
    border: 0;
    border-radius: calc(var(--r) - 2px);
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-mention__item.is-active,
  .chat-mention__item:hover {
    background: rgba(var(--accent-rgb), .1);
  }
  .chat-mention__name {
    font-size: .95rem;
    font-weight: 600;
    color: var(--text);
  }
  .chat-mention__user {
    font-size: .75rem;
    color: var(--muted);
  }
  .chat-msg__quote {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .15rem;
    width: 100%;
    margin: 0 0 .45rem;
    padding: .4rem .55rem;
    border: 0;
    border-left: 3px solid var(--accent);
    border-radius: 0 calc(var(--r) - 2px) calc(var(--r) - 2px) 0;
    background: rgba(var(--accent-rgb), .08);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-msg__quote-author {
    font-size: .72rem;
    font-weight: 600;
    color: var(--accent);
  }
  .chat-msg__quote-body {
    font-size: .82rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .chat-msg__replies {
    display: inline-flex;
    align-items: center;
    gap: .25rem;
    min-height: 44px;
    margin: .2rem 0 0;
    padding: .35rem .55rem;
    border: 0;
    border-radius: var(--r);
    background: rgba(var(--accent-rgb), .08);
    color: var(--accent);
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    line-height: 1.2;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-msg__replies:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .chat-msg--flash {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* FAB : revenir en bas après scroll / saut vers une citation (salon standalone) */
  .chat-jump-bottom {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(var(--composer-h, 7.5rem) + var(--keyboard-inset, 0px) + .55rem);
    z-index: 16;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
    min-height: 44px;
    min-width: 44px;
    max-width: calc(100vw - 1.5rem);
    padding: .55rem 1rem;
    border-radius: var(--r);
    border: 1px solid rgba(var(--accent-rgb), .35);
    background: var(--surface);
    color: var(--accent);
    font: inherit;
    font-family: var(--font-b);
    font-size: .85rem;
    font-weight: 600;
    letter-spacing: .02em;
    box-shadow: 0 6px 20px rgba(26, 23, 20, .16);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-jump-bottom:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .chat-jump-bottom:active {
    background: rgba(var(--accent-rgb), .1);
  }
  .chat-jump-bottom__icon {
    font-size: 1.1rem;
    line-height: 1;
  }
  .chat-jump-bottom__label {
    white-space: nowrap;
  }
  .chat-room--embedded .chat-jump-bottom {
    display: none !important;
  }
  .chat-atts { margin: .5rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .4rem; }
  .chat-atts a {
    color: var(--accent);
    word-break: break-all;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }
  .chat-atts a.chat-atts__img {
    min-height: 0;
    display: inline-block;
    max-width: 100%;
  }
  .chat-atts img {
    max-width: min(100%, 280px);
    border-radius: calc(var(--r) - 2px);
    display: block;
  }
  /* Zoom hover : uniquement thumbs composer (.chat-pending-atts__thumb), pas le fil */
  .chat-att-zoom { display: none; }
  @media (hover: hover) and (pointer: fine) {
    .chat-att-zoom {
      display: block;
      position: fixed;
      z-index: 80;
      pointer-events: none;
      padding: .35rem;
      border-radius: var(--r);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 12px 36px rgba(26, 23, 20, .22);
      color: var(--text);
      max-width: calc(100vw - 1.5rem);
      max-height: calc(100vh - 1.5rem);
    }
    .chat-att-zoom img {
      display: block;
      max-width: var(--zoom-max-w, 520px);
      max-height: var(--zoom-max-h, 520px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: calc(var(--r) - 2px);
    }
  }

  .chat-composer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 15;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: .55rem .75rem;
    padding-bottom: calc(.55rem + env(safe-area-inset-bottom));
    padding-left: max(.75rem, env(safe-area-inset-left));
    padding-right: max(.75rem, env(safe-area-inset-right));
    /* visualViewport JS may override bottom */
  }
  .chat-composer.is-dragover {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: rgba(var(--accent-rgb), .06);
  }
  .chat-composer__drop {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: rgba(var(--accent-rgb), .12);
    color: var(--accent);
    font-weight: 600;
    font-size: .95rem;
    border-radius: var(--r) var(--r) 0 0;
  }
  .chat-composer__inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: .4rem;
  }
  .chat-composer textarea,
  .chat-composer__editor {
    width: 100%;
    min-height: 44px;
    max-height: 110px;
    resize: none;
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: .7rem .8rem;
    font: inherit;
    font-size: 1rem;
    color: var(--text);
    background: var(--bg);
    line-height: 1.35;
  }
  .chat-composer__editor {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    word-break: break-word;
    white-space: pre-wrap;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  .chat-composer__editor:focus {
    border-color: var(--accent);
  }
  .chat-composer__editor.is-empty:before {
    content: attr(data-placeholder);
    color: var(--muted);
    pointer-events: none;
    float: left;
    height: 0;
  }
  .chat-composer__editor strong,
  .chat-composer__editor b {
    font-weight: 700;
    color: var(--text);
  }
  .chat-composer__editor em,
  .chat-composer__editor i {
    font-style: italic;
    color: var(--text);
  }
  .chat-composer__editor a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .chat-composer__row {
    display: flex;
    flex-wrap: wrap;
    gap: .45rem;
    align-items: center;
  }
  .chat-attach.chat-fmt {
    font-size: .95rem;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .chat-attach.chat-fmt strong {
    font-weight: 700;
    color: inherit;
  }
  .chat-attach.chat-fmt em {
    font-style: italic;
    font-weight: 600;
    color: inherit;
  }
  .chat-reply-bar {
    display: flex;
    align-items: flex-start;
    gap: .5rem;
    padding: .45rem .55rem;
    border-radius: var(--r);
    border: 1px solid rgba(var(--accent-rgb), .3);
    background: rgba(var(--accent-rgb), .08);
    color: var(--text);
  }
  .chat-reply-bar__text {
    flex: 1;
    min-width: 0;
    font-size: .82rem;
    line-height: 1.35;
  }
  .chat-reply-bar__label {
    display: block;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .1rem;
  }
  .chat-reply-bar__text strong { color: var(--accent); font-weight: 600; }
  .chat-reply-bar__preview {
    display: block;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-reply-bar__cancel {
    flex-shrink: 0;
    display: inline-flex;
