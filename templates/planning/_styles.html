{% comment %}Styles partagés du module planning — inclure via {% block extra_css %}{% endcomment %}
<style>
  .pl { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem 3.5rem; }
  @media (min-width: 640px) {
    .pl { padding: 2rem 1.5rem 4rem; }
  }
  .pl-head { margin-bottom: 1.75rem; }
  .pl-head h1 {
    font-family: var(--font-d); font-size: clamp(1.6rem, 3vw, 2.1rem);
    font-weight: 700; margin-bottom: .35rem;
  }
  .pl-sub { color: var(--muted); font-size: .95rem; max-width: 36rem; }
  .pl-nav {
    display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;
    padding-bottom: 1rem; border-bottom: 1px solid var(--border);
    /* Reset site chrome <nav> styles if they ever leak again */
    position: static; z-index: auto; background: transparent;
  }
  @media (min-width: 720px) {
    .pl-nav { flex-direction: row; flex-wrap: wrap; align-items: flex-end; gap: 1.25rem 1.75rem; }
  }
  .pl-nav__group { min-width: 0; }
  .pl-nav__label {
    display: block; margin-bottom: .35rem;
    font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted);
  }
  .pl-nav__links { display: flex; flex-wrap: wrap; gap: .35rem; }
  .pl-nav a {
    font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; padding: .45rem .7rem; min-height: 44px;
    display: inline-flex; align-items: center;
    border-radius: var(--r); transition: color var(--trans), background var(--trans);
  }
  .pl-nav a:hover, .pl-nav a.is-active {
    color: var(--accent); background: rgba(var(--accent-rgb), .08);
  }
  .pl-nav-context {
    display: flex; flex-wrap: wrap; gap: .35rem; align-items: center;
    margin: -.75rem 0 1.5rem; padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .pl-nav-context a {
    font-size: .8rem; font-weight: 600; color: var(--muted); text-decoration: none;
    padding: .45rem .7rem; min-height: 44px; display: inline-flex; align-items: center;
    border-radius: var(--r); transition: color var(--trans), background var(--trans);
  }
  .pl-nav-context a:hover { color: var(--accent); background: rgba(var(--accent-rgb), .08); }
  .pl-head__row {
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
    gap: .75rem 1rem;
  }
  .pl-head__row .pl-btn, .pl-head__row .btn { flex-shrink: 0; }
  .pl-section { margin-bottom: 2rem; }
  .pl-section h2 {
    font-family: var(--font-d); font-size: 1.25rem; margin-bottom: .75rem;
  }
  .pl-empty { color: var(--muted); font-size: .9rem; padding: .5rem 0; }
  .pl-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--border);
  }
  .pl-row:last-child { border-bottom: none; }
  .pl-row__main { min-width: 0; flex: 1; }
  .pl-row__title {
    font-weight: 600; font-size: .95rem; text-decoration: none; color: var(--text);
  }
  .pl-row__title:hover { color: var(--accent); }
  .pl-row__meta { font-size: .8rem; color: var(--muted); margin-top: .2rem; }
  .pl-row__actions { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; flex-shrink: 0; }
  .pl-badge {
    display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; padding: .2rem .5rem; border-radius: var(--r);
    background: rgba(0,0,0,.06); color: var(--muted);
  }
  .pl-badge--success { background: rgba(42,107,60,.12); color: var(--ok); }
  .pl-badge--warning { background: rgba(184,137,42,.15); color: var(--gold-text); }
  .pl-badge--danger { background: rgba(var(--accent-rgb),.12); color: var(--accent); }
  .pl-badge--neutral { background: rgba(0,0,0,.06); color: var(--muted); }
  .pl-btn {
    appearance: none; border: 1.5px solid var(--border); background: #fff;
    color: var(--text); font: inherit; font-size: .8rem; font-weight: 600;
    padding: .4rem .75rem; border-radius: var(--r); cursor: pointer;
    letter-spacing: .02em; transition: border-color var(--trans), background var(--trans), color var(--trans), transform var(--trans);
  }
  .pl-btn:hover { border-color: var(--text); }
  .pl-btn:active { transform: scale(.97); }
  .pl-btn:disabled { opacity: .5; cursor: not-allowed; }
  .pl-btn--yes { border-color: var(--ok); color: var(--ok); }
  .pl-btn--yes.is-active, .pl-btn--yes:hover { background: var(--ok); color: #fff; }
  .pl-btn--maybe { border-color: var(--gold); color: var(--gold-text); }
  .pl-btn--maybe.is-active, .pl-btn--maybe:hover { background: var(--gold); color: #fff; }
  .pl-btn--no { border-color: var(--accent); color: var(--accent); }
  .pl-btn--no.is-active, .pl-btn--no:hover { background: var(--accent); color: #fff; }
  .pl-btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pl-btn--primary:hover { background: var(--accent-h); }
  .pl-toast {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: .65rem 1.1rem; border-radius: var(--r);
    font-size: .85rem; z-index: 150; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  .pl-stats {
    display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; margin: .75rem 0 1.25rem;
    font-size: .85rem; color: var(--muted);
  }
  .pl-stats strong { color: var(--text); font-weight: 600; }
  .pl-section-block { margin-bottom: 1.25rem; }
  .pl-section-block h3 {
    font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: .4rem;
  }
  .pl-form {
    display: flex; flex-direction: column; gap: .75rem;
    padding: 1rem 0; border-top: 1px solid var(--border); margin-top: 1rem;
  }
  .pl-form label { font-size: .8rem; font-weight: 600; display: block; margin-bottom: .25rem; }
  .pl-form input, .pl-form select, .pl-form textarea {
    width: 100%; padding: .55rem .7rem; border: 1px solid var(--border);
    border-radius: var(--r); font: inherit; background: #fff;
  }
  .pl-form__row { display: grid; gap: .75rem; }
  @media (min-width: 640px) {
    .pl-form__row--2 { grid-template-columns: 1fr 1fr; }
  }
  .pl-mode-toggle {
    display: flex; gap: .35rem; margin: .35rem 0 .6rem; flex-wrap: wrap;
  }
  .pl-mode-toggle__btn {
    flex: 1 1 auto; min-height: 44px; min-width: 5.5rem;
    padding: .45rem .7rem; border: 1px solid var(--border);
    border-radius: var(--r); background: var(--surface); color: var(--text);
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .pl-mode-toggle__btn.is-active {
    border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    color: var(--accent);
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .pl-option {
    padding: 1rem 0; border-bottom: 1px solid var(--border);
  }
  .pl-option__counts { font-size: .8rem; color: var(--muted); margin: .4rem 0 .6rem; }
  .pl-reveal { overflow: hidden; }
  [x-cloak] { display: none !important; }

  /* Calendrier annuel — mobile first */
  .pl-year-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin-bottom: 1.25rem;
  }
  .pl-year-nav__current {
    font-family: var(--font-d); font-weight: 700; font-size: 1.15rem;
  }
  .pl-year {
    display: flex; flex-direction: column; gap: 1.75rem;
  }
  @media (min-width: 900px) {
    .pl-year {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem 1.75rem;
    }
  }
  .pl-month h2 {
    font-family: var(--font-d); font-size: 1.15rem; margin-bottom: .65rem;
  }
  .pl-cal { width: 100%; }
  .pl-cal__weekdays,
  .pl-cal__week {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 2px;
  }
  .pl-cal__wd {
    text-align: center; font-size: .65rem; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    padding: .2rem 0 .35rem;
  }
  .pl-cal__cell { position: relative; min-width: 0; }
  .pl-cal__day {
    appearance: none; border: none; background: rgba(0,0,0,.03);
    position: relative; width: 100%;
    min-height: 2.75rem; padding: .25rem .1rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .15rem; border-radius: var(--r); cursor: pointer; font: inherit;
    color: var(--text); transition: background var(--trans), color var(--trans), transform var(--trans);
  }
  .pl-cal__day:hover { background: rgba(0,0,0,.07); }
  .pl-cal__day:active { transform: scale(.96); }
  .pl-cal__day--empty { background: transparent; cursor: default; pointer-events: none; }
  .pl-cal__day.is-today {
    outline: 1.5px solid var(--accent); outline-offset: -1px;
    background: rgba(201,79,58,.08);
  }
  .pl-cal__day.is-past { color: var(--muted); }
  .pl-cal__day.has-events {
    font-weight: 700;
    background: rgba(201, 79, 58, .22);
    color: var(--text);
  }
  .pl-cal__day.has-events:hover {
    background: rgba(201, 79, 58, .32);
  }
  .pl-cal__day.has-concert {
    background: rgba(138, 106, 26, .28);
    color: var(--text);
  }
  .pl-cal__day.has-concert:hover {
    background: rgba(138, 106, 26, .38);
  }
  .pl-cal__day.is-past.has-events {
    background: rgba(201, 79, 58, .12);
    color: var(--muted);
  }
  .pl-cal__day.is-past.has-concert {
    background: rgba(138, 106, 26, .16);
  }
  .pl-cal__day.is-today.has-events,
  .pl-cal__day.is-today.has-concert {
    outline-width: 2px;
  }
  .pl-cal__num { font-size: .85rem; line-height: 1.2; }
  .pl-cal__add {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem; font-weight: 700; line-height: 1; color: var(--accent);
    background: rgba(245, 242, 236, .92); border-radius: inherit;
    opacity: 0; pointer-events: none;
    transition: opacity var(--trans);
  }
  @media (hover: hover) and (pointer: fine) {
    .pl-cal__day.can-add:not(.has-events):hover .pl-cal__add,
    .pl-cal__day.can-add:not(.has-events):focus-visible .pl-cal__add {
      opacity: 1;
    }
  }
  .pl-cal__day.can-add:not(.has-events):focus-visible .pl-cal__add {
    opacity: 1;
  }
  .pl-cal-tip {
    position: absolute; z-index: 40; left: 50%; top: calc(100% + 4px);
    transform: translateX(-50%);
    width: max-content; max-width: min(16.5rem, 70vw);
    padding: .65rem .75rem;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--r);
    box-shadow: 0 10px 28px rgba(0,0,0,.14);
    pointer-events: none; text-align: left;
  }
  .pl-cal-tip__event + .pl-cal-tip__event {
    margin-top: .55rem; padding-top: .55rem;
    border-top: 1px solid var(--border);
  }
  .pl-cal-tip__event.is-concert .pl-cal-tip__title { color: var(--accent); }
  .pl-cal-tip__title {
    font-weight: 600; font-size: .82rem; margin: 0 0 .2rem; line-height: 1.25;
  }
  .pl-cal-tip__line {
    margin: 0; font-size: .72rem; color: var(--muted); line-height: 1.35;
  }
  .pl-cal-tip__line span { white-space: nowrap; }
  .pl-cal-tip__line.is-warn { color: var(--accent); font-weight: 600; }
  .pl-cal-tip__line.is-ok { color: var(--ok); }
  .pl-day-events {
    margin-top: .75rem; padding: .75rem 0 0;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: .65rem;
  }
  .pl-day-events__label {
    font-size: .75rem; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
  }
  .pl-day-events__card {
    padding: .65rem .75rem;
    background: rgba(0,0,0,.03);
    border-radius: var(--r);
    border-left: 3px solid var(--muted);
  }
  .pl-day-events__card.is-concert { border-left-color: var(--accent); }
  .pl-day-events__item {
    display: flex; flex-direction: column; gap: .15rem;
    text-decoration: none; color: var(--text); font-size: .95rem;
    min-height: 2.5rem; justify-content: center;
  }
  .pl-day-events__type {
    font-size: .72rem; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
  }
  .pl-day-events__card.is-concert .pl-day-events__type { color: var(--accent); }
  .pl-day-events__item:hover strong { color: var(--accent); }
  .pl-event-stats {
    display: grid; gap: .35rem; margin: .55rem 0 0; padding: 0;
  }
  .pl-event-stats > div {
    display: grid; grid-template-columns: 7.5rem 1fr; gap: .35rem .5rem;
    font-size: .8rem; align-items: baseline;
  }
  .pl-event-stats dt {
    margin: 0; color: var(--muted); font-weight: 600; font-size: .72rem;
    letter-spacing: .03em; text-transform: uppercase;
  }
  .pl-event-stats dd { margin: 0; color: var(--text); }
  .pl-event-stats__split { color: var(--muted); white-space: nowrap; }
  .pl-event-stats dd.is-warn { color: var(--accent); font-weight: 600; }
  .pl-event-stats dd.is-ok { color: var(--ok); }
  .pl-event-stats .wx { font-size: inherit; }
  .pl-day-events__salon {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    margin-top: .65rem;
    padding: .7rem .85rem;
    min-height: 2.75rem;
    border-radius: var(--r);
    border: 1px solid rgba(var(--accent-rgb), .35);
    background: rgba(var(--accent-rgb), .08);
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: .9rem;
  }
  .pl-day-events__salon:hover { background: rgba(var(--accent-rgb), .14); }

  /* Page acceptation / sondage — mobile first */
  .pl-accept__head { margin-bottom: 1.25rem; }
  .pl-accept__title {
    font-family: var(--font-d); font-size: 1.65rem; font-weight: 700;
    line-height: 1.2; margin: 0 0 .75rem; color: var(--text);
  }
  .pl-accept__when {
    display: flex; flex-direction: column; gap: .15rem;
    margin: 0 0 .75rem; color: var(--text);
  }
  .pl-accept__day {
    font-size: .85rem; font-weight: 600; color: var(--muted);
    text-transform: capitalize; letter-spacing: .02em;
  }
  .pl-accept__fulldate {
    font-family: var(--font-d); font-size: 1.35rem; font-weight: 700;
    line-height: 1.25; text-transform: capitalize;
  }
  .pl-accept__time {
    font-size: 1.15rem; font-weight: 600; color: var(--accent);
  }
  .pl-accept__meta {
    margin: 0; font-size: .95rem; color: var(--muted); line-height: 1.45;
  }
  .pl-accept__type { color: var(--text); font-weight: 600; }
  .pl-accept__sep { margin: 0 .35rem; color: var(--muted); }
  .pl-accept__venue { color: var(--text); }
  .pl-accept__dates { display: flex; flex-direction: column; gap: 1.25rem; margin-top: 1.5rem; }
  .pl-accept__date {
    padding: 1.15rem 0; border-top: 1px solid var(--border);
  }
  .pl-accept__date:first-child { border-top: none; padding-top: 0; }
  .pl-accept__actions {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem;
    width: 100%;
  }
  .pl-accept__actions .pl-btn { min-height: 48px; width: 100%; justify-content: center; }
  .pl-accept__response { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
  .pl-accept__staff {
    margin-top: 2rem; padding: 1rem; border: 1px solid var(--border);
    border-radius: var(--r); background: var(--surface);
  }
  .pl-accept__staff summary {
    cursor: pointer; font-weight: 600; min-height: 44px;
    display: flex; align-items: center; color: var(--text);
  }
  .pl-accept__staff[open] summary { margin-bottom: .75rem; }
  .pl-chat-link {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    min-height: 2.75rem;
  }
  .pl-chat-link:hover { text-decoration: underline; }
  .pl-chat-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.5rem;
    min-height: 1.5rem;
    padding: 0 .4rem;
    border-radius: var(--r);
    background: var(--accent);
    color: #fff;
    font-size: .75rem;
    font-weight: 700;
    line-height: 1;
    flex-shrink: 0;
  }
  .pl-nav .pl-chat-badge {
    margin-left: .25rem;
    vertical-align: middle;
  }

  .pl-modal-root {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0;
  }
  @media (min-width: 640px) {
    .pl-modal-root { align-items: center; padding: 1rem; }
  }
  .pl-modal-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,.45);
  }
  .pl-modal {
    position: relative; width: 100%; max-width: 28rem; max-height: 92vh;
    overflow: auto; background: var(--surface); color: var(--text);
    border-radius: 12px 12px 0 0; padding: 1.1rem 1rem 1.5rem;
    box-shadow: 0 -8px 32px rgba(0,0,0,.18);
  }
  @media (min-width: 640px) {
    .pl-modal {
      border-radius: 8px; padding: 1.25rem 1.25rem 1.5rem;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
  }
  .pl-modal__head {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin-bottom: .5rem;
  }
  .pl-modal__head h2 {
    font-family: var(--font-d); font-size: 1.25rem; margin: 0;
  }
  .pl-modal .pl-form { border-top: none; margin-top: 0; padding-top: .5rem; }
</style>
