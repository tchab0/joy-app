{% load static %}
<link rel="stylesheet" href="{% static 'planning/planning.css' %}?v=29">
<style>
  /* Compact + nav mobile — inline pour bypass cache CSS immutable */
  .pl { padding-top: .25rem !important; }
  .pl-head { margin-bottom: .75rem !important; }
  .pl-head .page-lead--in-head { margin-top: 0 !important; }
  .pl-nav {
    flex-wrap: wrap !important;
    overflow-x: visible !important;
    gap: .35rem !important;
  }
  .pl-nav__primary {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    align-items: stretch !important;
    flex: 1 1 100% !important;
    gap: .35rem !important;
    min-width: 0 !important;
  }
  .pl-nav__group {
    flex: 0 0 auto !important;
    min-width: 0 !important;
    padding: .3rem .35rem .35rem !important;
  }
  .pl-nav__primary .pl-nav__group:first-child { flex: 1 1 0 !important; }
  .pl-nav__primary .pl-nav__group:not(:first-child) {
    flex: 0 0 auto !important;
    padding: .3rem .25rem .35rem !important;
  }
  .pl-nav__group--staff { flex: 1 1 100% !important; }
  .pl-nav__group-head {
    flex-wrap: nowrap !important;
    justify-content: space-between !important;
  }
  .pl-ui-mode { flex-shrink: 0 !important; }
  .pl-nav__links { flex-wrap: wrap !important; }
  .pl-nav a {
    font-size: .62rem !important;
    padding: .25rem .3rem !important;
  }
  .pl-nav__primary .pl-nav__group:not(:first-child) a {
    padding: .25rem .22rem !important;
  }
  @media (min-width: 720px) {
    .pl { padding-top: 1rem !important; }
    .pl-head { margin-bottom: 1rem !important; }
    .pl-head .page-lead--in-head { margin-top: .45rem !important; }
    .pl-nav { gap: .65rem .85rem !important; }
    .pl-nav__primary {
      flex: 0 1 auto !important;
      flex-wrap: wrap !important;
      gap: .65rem .85rem !important;
    }
    .pl-nav__group,
    .pl-nav__primary .pl-nav__group:first-child,
    .pl-nav__primary .pl-nav__group:not(:first-child),
    .pl-nav__group--staff {
      flex: 0 1 auto !important;
      padding: .45rem .7rem .5rem !important;
    }
    .pl-nav a,
    .pl-nav__primary .pl-nav__group:not(:first-child) a {
      font-size: .8rem !important;
      padding: .45rem .7rem !important;
    }
  }

  /* Repères d'étape & choix d'intention (mobile-first, tokens base.html) */
  .pl-guide {
    margin: 0 0 .9rem;
    padding: .75rem .9rem;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--r);
    background: var(--surface);
    color: var(--text);
    font-size: .88rem;
    line-height: 1.45;
  }
  .pl-guide--ok { border-left-color: var(--ok); }
  .pl-guide--staff {
    border-left-color: var(--staff);
    background: rgba(var(--staff-rgb), .06);
  }
  .pl-guide__step {
    display: block;
    font-size: .74rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--accent);
    margin-bottom: .2rem;
  }
  .pl-guide--ok .pl-guide__step { color: var(--ok); }
  .pl-guide--staff .pl-guide__step { color: var(--staff); }
  .pl-guide__title {
    font-weight: 600;
    color: var(--text);
    margin: 0 0 .2rem;
  }
  .pl-guide__text {
    color: var(--muted);
    margin: 0;
  }
  .pl-guide__summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--text);
    min-height: 36px;
    display: flex;
    align-items: center;
  }
  .pl-intent-grid {
    display: grid;
    gap: .6rem;
    margin-bottom: .5rem;
  }
  @media (min-width: 640px) {
    .pl-intent-grid { grid-template-columns: 1fr 1fr; }
  }
  .pl-intent-card {
    display: flex;
    align-items: flex-start;
    gap: .6rem;
    padding: .7rem .8rem;
    border: 1.5px solid var(--border);
    border-radius: var(--r);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    min-height: 48px;
  }
  .pl-intent-card input[type="radio"] {
    margin-top: .2rem;
    flex-shrink: 0;
  }
  .pl-intent-card.is-active {
    border-color: var(--accent);
    background: var(--bg);
  }
  .pl-intent-card__title {
    display: block;
    font-weight: 600;
    color: var(--text);
    font-size: .9rem;
  }
  .pl-intent-card__desc {
    display: block;
    font-size: .8rem;
    color: var(--muted);
    margin-top: .15rem;
    line-height: 1.35;
    font-weight: 400;
  }
  .pl-slot-row {
    display: grid;
    gap: .5rem;
    padding: .65rem;
    border: 1px solid var(--border);
    border-radius: var(--r);
    background: var(--bg);
    color: var(--text);
    margin-top: .5rem;
  }
</style>
