{% comment %}Styles partagés du module planning — inclure via {% block extra_css %}{% endcomment %}
<style>
  .pl { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .pl-head { margin-bottom: 1.75rem; }
  .pl-head h1 {
    font-family: var(--font-d); font-size: clamp(1.6rem, 3vw, 2.1rem);
    font-weight: 700; margin-bottom: .35rem;
  }
  .pl-sub { color: var(--muted); font-size: .95rem; max-width: 36rem; }
  .pl-nav {
    display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem;
    padding-bottom: 1rem; border-bottom: 1px solid var(--border);
  }
  .pl-nav a {
    font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; padding: .35rem .65rem;
    border-radius: var(--r); transition: color var(--trans), background var(--trans);
  }
  .pl-nav a:hover, .pl-nav a.is-active { color: var(--text); background: rgba(0,0,0,.04); }
  .pl-section { margin-bottom: 2rem; }
  .pl-section h2 {
    font-family: var(--font-d); font-size: 1.25rem; margin-bottom: .75rem;
  }
  .pl-empty { color: var(--muted); font-size: .9rem; padding: .5rem 0; }
  .pl-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--border);
  }
  .pl-row:last-child { border-bottom: none; }
  .pl-row__main { min-width: 0; flex: 1; }
  .pl-row__title {
    font-weight: 600; font-size: .95rem; text-decoration: none; color: var(--text);
  }
  .pl-row__title:hover { color: var(--accent); }
  .pl-row__meta { font-size: .8rem; color: var(--muted); margin-top: .2rem; }
  .pl-row__actions { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; flex-shrink: 0; }
  .pl-badge {
    display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; padding: .2rem .5rem; border-radius: var(--r);
    background: rgba(0,0,0,.06); color: var(--muted);
  }
  .pl-badge--success { background: rgba(46,125,50,.12); color: #2e7d32; }
  .pl-badge--warning { background: rgba(184,137,42,.15); color: #8a6a1a; }
  .pl-badge--danger { background: rgba(201,79,58,.12); color: var(--accent); }
  .pl-badge--neutral { background: rgba(0,0,0,.06); color: var(--muted); }
  .pl-btn {
    appearance: none; border: 1.5px solid var(--border); background: #fff;
    color: var(--text); font: inherit; font-size: .8rem; font-weight: 600;
    padding: .4rem .75rem; border-radius: var(--r); cursor: pointer;
    letter-spacing: .02em; transition: border-color var(--trans), background var(--trans), color var(--trans), transform var(--trans);
  }
  .pl-btn:hover { border-color: var(--text); }
  .pl-btn:active { transform: scale(.97); }
  .pl-btn:disabled { opacity: .5; cursor: not-allowed; }
  .pl-btn--yes { border-color: #2e7d32; color: #2e7d32; }
  .pl-btn--yes.is-active, .pl-btn--yes:hover { background: #2e7d32; color: #fff; }
  .pl-btn--maybe { border-color: var(--gold); color: #8a6a1a; }
  .pl-btn--maybe.is-active, .pl-btn--maybe:hover { background: var(--gold); color: #fff; }
  .pl-btn--no { border-color: var(--accent); color: var(--accent); }
  .pl-btn--no.is-active, .pl-btn--no:hover { background: var(--accent); color: #fff; }
  .pl-btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pl-btn--primary:hover { background: var(--accent-h); }
  .pl-toast {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: .65rem 1.1rem; border-radius: var(--r);
    font-size: .85rem; z-index: 150; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  .pl-stats {
    display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; margin: .75rem 0 1.25rem;
    font-size: .85rem; color: var(--muted);
  }
  .pl-stats strong { color: var(--text); font-weight: 600; }
  .pl-section-block { margin-bottom: 1.25rem; }
  .pl-section-block h3 {
    font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: .4rem;
  }
  .pl-form {
    display: flex; flex-direction: column; gap: .75rem;
    padding: 1rem 0; border-top: 1px solid var(--border); margin-top: 1rem;
  }
  .pl-form label { font-size: .8rem; font-weight: 600; display: block; margin-bottom: .25rem; }
  .pl-form input, .pl-form select, .pl-form textarea {
    width: 100%; padding: .55rem .7rem; border: 1px solid var(--border);
    border-radius: var(--r); font: inherit; background: #fff;
  }
  .pl-form__row { display: grid; gap: .75rem; }
  @media (min-width: 640px) {
    .pl-form__row--2 { grid-template-columns: 1fr 1fr; }
  }
  .pl-option {
    padding: 1rem 0; border-bottom: 1px solid var(--border);
  }
  .pl-option__counts { font-size: .8rem; color: var(--muted); margin: .4rem 0 .6rem; }
  .pl-reveal { overflow: hidden; }
  [x-cloak] { display: none !important; }
</style>
