{% comment %}Styles partagés du module planning — inclure via {% block extra_css %}{% endcomment %}
<style>
  .pl { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem 3.5rem; }
  @media (min-width: 640px) {
    .pl { padding: 2rem 1.5rem 4rem; }
  }
  .pl-head { margin-bottom: 1.75rem; }
  .pl-head h1 {
    font-family: var(--font-d); font-size: clamp(1.6rem, 3vw, 2.1rem);
    font-weight: 700; margin-bottom: .35rem;
  }
  .pl-sub { color: var(--muted); font-size: .95rem; max-width: 36rem; }
  /* Module nav — Planning / Répertoire / Staff as distinct clusters */
  .pl-nav {
    display: flex; flex-direction: row; flex-wrap: wrap; align-items: stretch;
    gap: .5rem; margin-bottom: .65rem;
    padding-bottom: .5rem; border-bottom: 1px solid var(--border);
    /* Reset site chrome <nav> styles if they ever leak again */
    position: static; z-index: auto; background: transparent;
  }
  .pl-nav__group {
    display: flex; flex-direction: column; gap: .2rem;
    min-width: 0; flex: 0 1 auto;
    padding: .35rem .5rem .4rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    border-top: 2px solid rgba(var(--accent-rgb), .4);
  }
  .pl-nav__group--staff {
    background: rgba(var(--staff-rgb), .07);
    border-color: rgba(var(--staff-rgb), .2);
    border-top-color: rgba(var(--staff-rgb), .55);
  }
  .pl-nav__label {
    display: block;
    font-size: .58rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold-text); line-height: 1.2;
  }
  .pl-nav__group--staff .pl-nav__label { color: var(--staff); }
  .pl-nav__links { display: flex; flex-wrap: wrap; gap: .15rem .2rem; align-items: center; }
  .pl-nav a {
    font-size: .7rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; padding: .3rem .45rem; min-height: 36px;
    display: inline-flex; align-items: center;
    border-radius: var(--r); transition: color var(--trans), background var(--trans);
  }
  .pl-nav a:hover, .pl-nav a.is-active {
    color: var(--accent); background: rgba(var(--accent-rgb), .08);
  }
  .pl-nav__group--staff a:hover,
  .pl-nav__group--staff a.is-active {
    color: var(--staff); background: rgba(var(--staff-rgb), .14);
  }
  @media (min-width: 720px) {
    .pl-nav {
      gap: .65rem .85rem; margin-bottom: 1.5rem; padding-bottom: 1rem;
    }
    .pl-nav__group {
      padding: .45rem .7rem .5rem;
    }
    .pl-nav__label {
      font-size: .65rem; margin-bottom: .1rem;
    }
    .pl-nav__links { gap: .35rem; }
    .pl-nav a {
      font-size: .8rem; letter-spacing: .04em; padding: .45rem .7rem; min-height: 44px;
    }
  }
  .pl-nav-context {
    display: flex; flex-wrap: wrap; gap: .25rem; align-items: center;
    margin: -.25rem 0 .65rem; padding-bottom: .5rem;
    border-bottom: 1px solid var(--border);
  }
  .pl-nav-context a {
    font-size: .72rem; font-weight: 600; color: var(--muted); text-decoration: none;
    padding: .3rem .45rem; min-height: 36px; display: inline-flex; align-items: center;
    border-radius: var(--r); transition: color var(--trans), background var(--trans);
  }
  @media (min-width: 720px) {
    .pl-nav-context {
      gap: .35rem; margin: -.75rem 0 1.5rem; padding-bottom: 1rem;
    }
    .pl-nav-context a {
      font-size: .8rem; padding: .45rem .7rem; min-height: 44px;
    }
  }
  .pl-nav-context a:hover { color: var(--accent); background: rgba(var(--accent-rgb), .08); }
  .pl-nav-context--staff {
    margin-bottom: .85rem;
    padding: .35rem .5rem .5rem;
    border: 1px solid rgba(var(--staff-rgb), .2);
    border-radius: var(--r);
    background: rgba(var(--staff-rgb), .07);
    border-bottom: 1px solid rgba(var(--staff-rgb), .2);
  }
  .pl-nav-context--staff a { color: var(--staff); }
  .pl-nav-context--staff a:hover {
    color: var(--staff); background: rgba(var(--staff-rgb), .14);
  }
  /* Panneaux / actions staff (Coulisses) — teinte slate, distincte du cream musicien */
  .pl-staff {
    padding: .75rem .85rem;
    border: 1px solid rgba(var(--staff-rgb), .2);
    border-radius: var(--r);
    background: rgba(var(--staff-rgb), .07);
    color: var(--text);
  }
  .pl-head__row {
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
    gap: .75rem 1rem;
  }
  .pl-head__row .pl-btn, .pl-head__row .btn { flex-shrink: 0; }
  .pl-section { margin-bottom: 2rem; }
  .pl-section--panel {
    padding: .85rem 1rem 1rem;
    border-radius: var(--r);
    border: 1px solid var(--border);
  }
  .pl-section--pending {
    background: rgba(var(--accent-rgb), .05);
    border-color: rgba(var(--accent-rgb), .14);
  }
  .pl-section--upcoming {
    background: var(--surface);
  }
  /* Même fond que « À répondre » pour les dates encore sans réponse ferme */
  .pl-row--needs-response {
    margin: 0 -.75rem;
    padding-left: .75rem;
    padding-right: .75rem;
    border-radius: var(--r);
    background: rgba(var(--accent-rgb), .05);
  }
  .pl-section h2 {
    font-family: var(--font-d); font-size: 1.25rem; margin-bottom: .75rem;
  }
  .pl-accordion__summary {
    font-family: var(--font-d);
    font-size: 1.25rem;
    color: var(--text);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    min-height: 2.75rem;
    margin-bottom: 0;
  }
  .pl-accordion__summary::-webkit-details-marker { display: none; }
  .pl-accordion__summary::before {
    content: "▸";
    display: inline-block;
    margin-right: .5rem;
    color: var(--accent);
    font-size: .9em;
    line-height: 1;
  }
  .pl-accordion[open] > .pl-accordion__summary {
    margin-bottom: .75rem;
  }
  .pl-accordion[open] > .pl-accordion__summary::before {
    content: "▾";
  }
  .pl-empty { color: var(--muted); font-size: .9rem; padding: .5rem 0; }
  /* Mobile-first : titre → actions RSVP → date/lieu/poste */
  .pl-row {
    display: flex; flex-direction: column; align-items: stretch;
    gap: .55rem; padding: .85rem 0; border-bottom: 1px solid var(--border);
  }
  .pl-row:last-child { border-bottom: none; }
  .pl-row__main { display: contents; }
  .pl-row__title {
    order: 1;
    font-weight: 600; font-size: .95rem; text-decoration: none; color: var(--text);
    align-self: start;
    padding: .15rem .4rem; margin: -.15rem -.4rem;
    border-radius: calc(var(--r) - 2px);
  }
  .pl-row__title:hover { color: var(--accent); }
  /* Même code couleur que le planning complet (tip / cartes jour) */
  .pl-row__title.is-confirmed {
    color: var(--ok);
    background: rgba(42, 107, 60, .12);
  }
  .pl-row__title.is-confirmed:hover { color: var(--ok); filter: brightness(.92); }
  .pl-row__title.is-proposal {
    color: var(--gold-text);
    background: rgba(184, 137, 42, .15);
  }
  .pl-row__title.is-proposal:hover { color: var(--gold-text); filter: brightness(.92); }
  .pl-row__title.is-rehearsal {
    color: var(--accent);
    background: rgba(var(--accent-rgb), .12);
  }
  .pl-row__title.is-rehearsal:hover { color: var(--accent-h); }
  .pl-row > .pl-row__actions { order: 2; }
  .pl-row__main > .pl-row__meta { order: 3; }
  .pl-row__meta { font-size: .8rem; color: var(--muted); margin-top: 0; }
  .pl-row__actions { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .pl-row__actions .pl-btn,
  .pl-row__actions .pl-badge {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  /* Invalidation d’un Oui : Non discret (moitié de hauteur) */
  .pl-row__actions .pl-btn--no.is-invalidate {
    min-height: 22px;
    padding-block: .15rem;
    font-size: .7rem;
  }
  .pl-row__actions .pl-badge {
    padding: .4rem .75rem;
    font-size: .75rem;
  }
  @media (min-width: 640px) {
    .pl-row {
      flex-direction: row; flex-wrap: wrap; align-items: flex-start;
      justify-content: space-between; gap: 1rem;
    }
    .pl-row__main {
      display: block; min-width: 0; flex: 1; order: 1;
    }
    .pl-row__title,
    .pl-row__main > .pl-row__meta { order: unset; }
    .pl-row__meta { margin-top: .2rem; }
    .pl-row > .pl-row__actions { order: 2; flex-shrink: 0; }
  }
  .pl-badge {
    display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; padding: .2rem .5rem; border-radius: var(--r);
    background: rgba(0,0,0,.06); color: var(--muted);
  }
  .pl-badge--success { background: rgba(42,107,60,.12); color: var(--ok); }
  .pl-badge--warning { background: rgba(184,137,42,.15); color: var(--gold-text); }
  .pl-badge--danger { background: rgba(var(--accent-rgb),.12); color: var(--accent); }
  .pl-badge--neutral { background: rgba(0,0,0,.06); color: var(--muted); }
  .pl-btn {
    appearance: none; border: 1.5px solid var(--border); background: #fff;
    color: var(--text); font: inherit; font-size: .8rem; font-weight: 600;
    padding: .4rem .75rem; border-radius: var(--r); cursor: pointer;
    letter-spacing: .02em; transition: border-color var(--trans), background var(--trans), color var(--trans), transform var(--trans);
  }
  .pl-btn:hover { border-color: var(--text); }
  .pl-btn:active { transform: scale(.97); }
  .pl-btn:disabled { opacity: .5; cursor: not-allowed; }
  .pl-btn.pl-btn--staff {
    border-color: rgba(var(--staff-rgb), .4);
    color: var(--staff);
    background: rgba(var(--staff-rgb), .08);
  }
  .pl-btn.pl-btn--staff:hover {
    border-color: var(--staff);
    color: var(--staff);
    background: rgba(var(--staff-rgb), .16);
  }
  .pl-btn--yes { border-color: var(--ok); color: var(--ok); }
  .pl-btn--yes.is-active, .pl-btn--yes:hover { background: var(--ok); color: #fff; }
  .pl-btn--maybe { border-color: var(--gold); color: var(--gold-text); }
  .pl-btn--maybe.is-active, .pl-btn--maybe:hover { background: var(--gold); color: #fff; }
  .pl-btn--no { border-color: var(--accent); color: var(--accent); }
  .pl-btn--no.is-active, .pl-btn--no:hover { background: var(--accent); color: #fff; }
  .pl-btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pl-btn--primary:hover { background: var(--accent-h); }
  .pl-toast {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: .65rem 1.1rem; border-radius: var(--r);
    font-size: .85rem; z-index: 150; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  .pl-stats {
    display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; margin: .75rem 0 1.25rem;
    font-size: .85rem; color: var(--muted);
  }
  .pl-stats strong { color: var(--text); font-weight: 600; }
  .pl-section-block { margin-bottom: 1.25rem; }
  .pl-section-block h3 {
    font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: .4rem;
  }

  /* Disposition scène — effectif admin (mobile-first, dense) */
  .pl-stage {
    display: flex;
    flex-direction: column;
    gap: .4rem;
    margin-bottom: .75rem;
  }
  .pl-stage__row {
    display: flex;
    flex-direction: column;
    gap: .3rem;
  }
  .pl-stage__seat {
    display: flex;
    flex-direction: column;
    gap: .2rem;
    min-width: 0;
    padding: .3rem .4rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
  }
  .pl-stage__poste {
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.2;
  }
  .pl-stage__person {
    box-sizing: border-box;
    color: var(--text);
    min-height: 2.35rem;
    padding: .35rem .45rem;
    border-radius: calc(var(--r) - 2px);
    /* Non confirmé / manquant par défaut → rouge (même gabarit que le vert) */
    background: rgba(var(--accent-rgb), .16);
  }
  .pl-stage__person--confirmed {
    background: rgba(42, 107, 60, .16);
  }
  .pl-stage__person--maybe {
    background: rgba(184, 137, 42, .2);
  }
  .pl-stage__person--declined,
  .pl-stage__person--invited,
  .pl-stage__person--replacement_needed,
  .pl-stage__person--vacant {
    background: rgba(var(--accent-rgb), .16);
  }
  .pl-stage__line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: .1rem .35rem;
    min-height: 1.25em;
    line-height: 1.25;
  }
  .pl-stage__name {
    font-size: .82rem;
    font-weight: 600;
    color: var(--text);
  }
  .pl-stage__role {
    font-size: .65rem;
    font-weight: 600;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .pl-stage__meta {
    margin: .15rem 0 0;
    font-size: .7rem;
    color: var(--text);
    line-height: 1.25;
  }
  .pl-stage__invite {
    display: flex;
    flex-direction: column;
    gap: .3rem;
    margin-top: .15rem;
    width: 100%;
  }
  .pl-stage__person--vacant .pl-stage__invite { margin-top: 0; }
  .pl-stage__invite select {
    width: 100%;
    min-height: 36px;
    padding: .3rem .4rem;
    border: 1px solid var(--border);
    border-radius: var(--r);
    font: inherit;
    font-size: .75rem;
    background: var(--surface);
    color: var(--text);
  }
  .pl-stage__invite .pl-btn {
    width: 100%;
    min-height: 36px;
    padding: .3rem .5rem;
    font-size: .75rem;
  }
  .pl-stage__invite-none {
    font-size: .7rem;
    color: var(--muted);
    line-height: 1.3;
  }
  @media (min-width: 640px) {
    .pl-stage__invite {
      flex-direction: row;
      align-items: stretch;
      gap: .25rem;
    }
    .pl-stage__invite select { flex: 1 1 auto; min-width: 0; }
    .pl-stage__invite .pl-btn {
      width: auto;
      flex: 0 0 auto;
      padding-left: .55rem;
      padding-right: .55rem;
    }
  }
  .pl-stage-extras {
    margin: 0 0 .65rem;
    padding-top: .5rem;
    border-top: 1px solid var(--border);
  }
  .pl-stage-extras h3 {
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 .35rem;
  }
  .pl-stage__seat--extra { margin-bottom: .3rem; }
  @media (min-width: 640px) {
    .pl-stage__row {
      flex-direction: row;
      align-items: stretch;
      gap: .3rem;
    }
    .pl-stage__seat {
      flex: 1 1 0;
      padding: .28rem .32rem;
    }
    .pl-stage__name { font-size: .75rem; }
  }

  /* Page effectif admin — hauteur compacte (scopes, n’affecte pas le reste du planning) */
  .pl--roster {
    max-width: 980px;
    padding-bottom: 2.25rem;
  }
  .pl--roster .pl-nav { margin-bottom: .4rem; padding-bottom: .35rem; }
  .pl--roster .pl-nav-context {
    margin: -.1rem 0 .4rem;
    padding-bottom: .35rem;
  }
  .pl--roster .pl-nav-context--staff {
    padding: .3rem .45rem .4rem;
  }
  .pl--roster .pl-head { margin-bottom: .75rem; }
  .pl--roster .pl-head h1 {
    font-size: clamp(1.35rem, 2.5vw, 1.75rem);
    margin-bottom: .15rem;
  }
  .pl--roster .pl-sub {
    font-size: .82rem;
    line-height: 1.35;
    max-width: none;
  }
  .pl--roster .pl-section { margin-bottom: 1.1rem; }
  .pl--roster .pl-section h2 {
    font-size: 1.05rem;
    margin-bottom: .35rem;
  }
  .pl--roster .pl-roster-lead {
    margin: 0 0 .45rem;
    font-size: .8rem;
    line-height: 1.35;
  }
  .pl--roster .pl-form {
    gap: .45rem;
    padding: .55rem 0;
    margin-top: .55rem;
  }
  .pl--roster .pl-form--tight {
    margin-top: .4rem;
    margin-bottom: 0;
    padding: .4rem 0;
  }
  .pl--roster .pl-form label { margin-bottom: .15rem; }
  .pl--roster .pl-form input,
  .pl--roster .pl-form select,
  .pl--roster .pl-form textarea {
    padding: .4rem .55rem;
  }
  .pl--roster .pl-mode-toggle { margin: .2rem 0 .35rem; gap: .25rem; }
  .pl--roster .pl-check { min-height: 40px; }
  .pl--roster .pl-row {
    padding-top: .45rem;
    padding-bottom: .45rem;
  }
  .pl--roster .pl-empty { margin: .35rem 0; }
  .pl-gear-line {
    display: flex;
    flex-wrap: nowrap;
    align-items: baseline;
    gap: .45rem;
    padding: .35rem 0;
    border-bottom: 1px solid var(--border);
    font-size: .88rem;
    color: var(--text);
    min-width: 0;
  }
  .pl-gear-line:last-child { border-bottom: none; }
  .pl-gear-line__name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1 1 auto;
  }
  .pl-gear-line__meta {
    flex: 0 0 auto;
    white-space: nowrap;
    color: var(--muted);
    font-size: .8rem;
  }
  .pl-form__actions--inline {
    display: flex;
    flex-direction: column;
    gap: .45rem;
    align-items: stretch;
  }
  .pl-form__actions--inline .pl-btn {
    width: 100%;
    min-height: 44px;
  }
  .pl-form__row--invite,
  .pl-form__row--gear {
    display: grid;
    gap: .45rem;
  }
  .pl-form__submit {
    display: flex;
    align-items: flex-end;
  }
  .pl-form__submit .pl-btn {
    width: 100%;
    min-height: 44px;
  }
  .invite-musician-form__hint {
    margin: .15rem 0 0;
    color: var(--muted);
    font-size: .75rem;
  }
  @media (min-width: 640px) {
    .pl-form__actions--inline {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }
    .pl-form__actions--inline .pl-btn {
      width: auto;
      flex-shrink: 0;
    }
    .pl-form__row--invite {
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto;
      align-items: end;
    }
    .pl-form__row--gear {
      grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
      align-items: end;
    }
    .pl-form__row--gear .pl-form__submit {
      justify-self: start;
    }
    .pl-form__submit .pl-btn {
      width: auto;
      white-space: nowrap;
    }
  }
  @media (min-width: 720px) {
    .pl--roster .pl-nav { margin-bottom: .75rem; padding-bottom: .55rem; }
    .pl--roster .pl-nav-context {
      margin: -.35rem 0 .65rem;
      padding-bottom: .55rem;
    }
  }
  .pl-form {
    display: flex; flex-direction: column; gap: .75rem;
    padding: 1rem 0; border-top: 1px solid var(--border); margin-top: 1rem;
  }
  .pl-form label { font-size: .8rem; font-weight: 600; display: block; margin-bottom: .25rem; }
  .pl-form input, .pl-form select, .pl-form textarea {
    width: 100%; padding: .55rem .7rem; border: 1px solid var(--border);
    border-radius: var(--r); font: inherit; background: #fff;
  }
  .pl-form input[type="checkbox"],
  .pl-form input[type="radio"] {
    width: auto; min-width: 1.15rem; min-height: 1.15rem;
    padding: 0; flex-shrink: 0; accent-color: var(--accent);
  }
  .pl-check {
    display: flex; align-items: center; gap: .55rem;
    font-weight: 500; min-height: 44px; margin-bottom: 0;
    color: var(--text); cursor: pointer;
  }
  .pl-form__row { display: grid; gap: .75rem; }
  @media (min-width: 640px) {
    .pl-form__row--2 { grid-template-columns: 1fr 1fr; }
  }
  .pl-mode-toggle {
    display: flex; gap: .35rem; margin: .35rem 0 .6rem; flex-wrap: wrap;
  }
  .pl-mode-toggle__btn {
    flex: 1 1 auto; min-height: 44px; min-width: 5.5rem;
    padding: .45rem .7rem; border: 1px solid var(--border);
    border-radius: var(--r); background: var(--surface); color: var(--text);
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .pl-mode-toggle__btn.is-active {
    border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    color: var(--accent);
  }
  .pl-venue-map-block { margin-top: .75rem; display: grid; gap: .45rem; }
  .pl-venue-map-toolbar {
    display: flex; flex-direction: column; gap: .35rem;
