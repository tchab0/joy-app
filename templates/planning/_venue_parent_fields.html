{% with p=id_prefix|default:"ev" %}
<div>
  <label>Lieu</label>
  <div class="pl-mode-toggle" role="group" aria-label="Choisir ou créer un lieu">
    <button type="button" class="pl-mode-toggle__btn"
            :class="{ 'is-active': venueMode === 'existing' }"
            @click="venueMode = 'existing'">Existant</button>
    <button type="button" class="pl-mode-toggle__btn"
            :class="{ 'is-active': venueMode === 'new' }"
            @click="venueMode = 'new'">Nouveau</button>
  </div>
  <input type="hidden" name="venue_mode" :value="venueMode">
  <div x-show="venueMode === 'existing'" x-cloak>
    <label for="{{ p }}_venue" class="visually-hidden">Lieu existant</label>
    <select name="venue_id" id="{{ p }}_venue" :required="venueMode === 'existing'">
      <option value="">Choisir…</option>
      {% for v in venues %}
      <option value="{{ v.pk }}">{{ v.nom }} — {{ v.ville }}</option>
      {% endfor %}
    </select>
  </div>
  <div x-show="venueMode === 'new'" x-cloak style="display:grid;gap:.75rem">
    <div>
      <label for="{{ p }}_venue_nom">Nom du lieu</label>
      <input type="text" name="venue_nom" id="{{ p }}_venue_nom"
             placeholder="ex. Salle des fêtes"
             :required="venueMode === 'new'">
    </div>
    <div class="pl-form__row pl-form__row--2">
      <div>
        <label for="{{ p }}_venue_ville">Ville</label>
        <input type="text" name="venue_ville" id="{{ p }}_venue_ville"
               placeholder="ex. La Roche-sur-Yon"
               :required="venueMode === 'new'">
      </div>
      <div>
        <label for="{{ p }}_venue_adresse">Adresse <span class="pl-row__meta">(optionnel)</span></label>
        <input type="text" name="venue_adresse" id="{{ p }}_venue_adresse"
               placeholder="ex. 12 rue de la Musique">
      </div>
    </div>
  </div>
</div>

{% if show_parent|default:True %}
<div>
  <label>Événement parent <span class="pl-row__meta">(optionnel)</span></label>
  <div class="pl-mode-toggle" role="group" aria-label="Événement parent">
    <button type="button" class="pl-mode-toggle__btn"
            :class="{ 'is-active': parentMode === 'none' }"
            @click="parentMode = 'none'">Aucun</button>
    <button type="button" class="pl-mode-toggle__btn"
            :class="{ 'is-active': parentMode === 'existing' }"
            @click="parentMode = 'existing'">Existant</button>
    <button type="button" class="pl-mode-toggle__btn"
            :class="{ 'is-active': parentMode === 'new' }"
            @click="parentMode = 'new'">Nouveau</button>
  </div>
  <input type="hidden" name="parent_mode" :value="parentMode">
  <div x-show="parentMode === 'existing'" x-cloak>
    <label for="{{ p }}_parent" class="visually-hidden">Événement parent existant</label>
    <select name="parent_id" id="{{ p }}_parent">
      <option value="">— Choisir… —</option>
      {% for p_ev in parent_events %}
      <option value="{{ p_ev.pk }}">{{ p_ev.titre }} ({{ p_ev.date_debut|date:"d/m/Y" }})</option>
      {% endfor %}
    </select>
  </div>
  <div x-show="parentMode === 'new'" x-cloak>
    <label for="{{ p }}_parent_titre" class="visually-hidden">Titre du nouvel événement parent</label>
    <input type="text" name="parent_titre" id="{{ p }}_parent_titre"
           placeholder="ex. Festival Jazz en Ville 2026"
           :required="parentMode === 'new'">
  </div>
</div>
{% else %}
<input type="hidden" name="parent_mode" value="none">
{% endif %}
{% endwith %}
