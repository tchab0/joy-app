<script>
function pollVotes(cfg) {
  cfg = cfg || {};
  return {
    open: !!cfg.open,
    csrf: cfg.csrf || '',
    viewer: cfg.viewer || null,
    choices: Object.assign({}, cfg.choices || {}),
    counts: Object.assign({}, cfg.counts || {}),
    voters: Object.assign({}, cfg.voters || {}),
    urls: cfg.urls || {},
    busy: {},
    toast: '',
    complete: false,
    onToast(msg) {
      this.toast = msg;
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => { this.toast = ''; }, 2200);
    },
    choiceOf(id) { return this.choices[id] || ''; },
    voteLabel(c) {
      if (c === 'yes') return 'Oui';
      if (c === 'no') return 'Non';
      if (c === 'maybe') return 'Peut-être';
      return '';
    },
    answeredSummary() {
      const ids = Object.keys(this.urls);
      if (!ids.length) return '';
      if (ids.length === 1) {
        const label = this.voteLabel(this.choices[ids[0]]);
        return label
          ? ('Votre réponse : ' + label + ' — vous pouvez encore la modifier.')
          : '';
      }
      return 'Vos réponses sont enregistrées — vous pouvez encore les modifier.';
    },
    isBusy(id) { return !!this.busy[id]; },
    countsOf(id) {
      const c = this.counts[id] || {};
      return {
        yes: Number(c.yes) || 0,
        no: Number(c.no) || 0,
        maybe: Number(c.maybe) || 0
      };
    },
    optionTotal(id) {
      const c = this.countsOf(id);
      return c.yes + c.no + c.maybe;
    },
    countsLabel(id) {
      const c = this.countsOf(id);
      return 'Oui ' + c.yes + ' · Peut-être ' + c.maybe + ' · Non ' + c.no;
    },
    barWidth(id, key) {
      const total = this.optionTotal(id);
      if (!total) return 0;
      return (this.countsOf(id)[key] / total) * 100;
    },
    votersOf(id) {
      const raw = this.voters[id] || {};
      return {
        yes: Array.isArray(raw.yes) ? raw.yes.slice() : [],
        maybe: Array.isArray(raw.maybe) ? raw.maybe.slice() : [],
        no: Array.isArray(raw.no) ? raw.no.slice() : []
      };
    },
    nameList(id, key) {
      const people = this.votersOf(id)[key] || [];
      if (!people.length) return 'Personne';
      const selfId = this.viewer && this.viewer.id;
      return people.map((person) => (
        person.id === selfId ? person.name + ' (vous)' : person.name
      )).join(', ');
    },
    _moveSelfVote(optionId, nextChoice) {
      if (!this.viewer || !this.viewer.id) return;
      const groups = this.votersOf(optionId);
      const selfId = this.viewer.id;
      ['yes', 'maybe', 'no'].forEach((key) => {
        groups[key] = groups[key].filter((person) => person.id !== selfId);
      });
      if (nextChoice && groups[nextChoice]) {
        groups[nextChoice].push({
          id: selfId,
          name: this.viewer.name || 'Vous'
        });
        groups[nextChoice].sort((a, b) =>
          String(a.name || '').localeCompare(String(b.name || ''), 'fr', {
            sensitivity: 'base'
          })
        );
      }
      this.voters[optionId] = groups;
    },
    allAnswered() {
      const ids = Object.keys(this.urls);
      return ids.length > 0 && ids.every((id) => !!this.choices[id]);
    },
    async vote(optionId, c) {
      if (!this.open) return;
      const url = this.urls[optionId];
      if (!url) return;
      this.busy[optionId] = true;
      try {
        const r = await fetch(url, {
          method: 'POST',
          headers: {
            'X-CSRFToken': this.csrf,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ choice: c })
        });
        const d = await r.json();
        if (d.ok) {
          this.choices[optionId] = d.choice;
          if (d.counts) {
            this.counts[optionId] = {
              yes: Number(d.counts.yes) || 0,
              no: Number(d.counts.no) || 0,
              maybe: Number(d.counts.maybe) || 0
            };
          }
          this._moveSelfVote(optionId, d.choice);
          window.dispatchEvent(new CustomEvent('pl-cal-presence', {
            detail: { optionId: Number(optionId), pollChoice: d.choice }
          }));
          this.onToast('Réponse enregistrée');
          if (this.allAnswered() && !this.complete) {
            this.complete = true;
            if (typeof cfg.onComplete === 'function') {
              cfg.onComplete.call(this);
            } else {
              this.$dispatch('poll-complete');
            }
          }
        } else {
          this.onToast(d.error || 'Erreur');
        }
      } finally {
        this.busy[optionId] = false;
      }
    }
  };
}
</script>
