{# Carte texte d’aide — masquable pour les utilisateurs connectés. #}
<div class="page-lead{% if lead_class %} {{ lead_class }}{% endif %}{% if can_dismiss_lead %} page-lead--dismissible{% endif %}"
     {% if can_dismiss_lead %}
     x-data="{ gone: false }"
     x-show="!gone"
     x-transition.opacity.duration.200ms
     {% endif %}>
  <div class="page-lead__text">{{ lead_content|safe }}</div>
  {% if can_dismiss_lead %}
  <button type="button"
          class="page-lead__dismiss"
          aria-label="Masquer cette aide"
          title="Masquer cette aide"
          @click="gone = true; fetch('{% url 'account_page_lead_dismiss' %}', {method:'POST', headers:{'X-CSRFToken':'{{ csrf_token }}','Content-Type':'application/json'}, body: JSON.stringify({key: '{{ lead_key|escapejs }}'})}).catch(function(){})">
    <span aria-hidden="true">&times;</span>
  </button>
  {% endif %}
</div>
