{% comment %}
  Bouton œil — aperçu PDF inline (sans téléchargement).
  Attendu : part (Part), optionnel title (aria).
{% endcomment %}
<a class="pl-btn pl-btn--icon rep-pdf-preview"
   href="{% url 'repertoire:part_pdf' part.pk %}?inline=1"
   target="_blank"
   rel="noopener"
   title="Aperçu"
   aria-label="{% if title %}{{ title }}{% else %}Aperçu PDF{% endif %}">
  <svg class="rep-pdf-preview__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
          d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
    <circle cx="12" cy="12" r="2.75" stroke="currentColor" stroke-width="1.75"/>
  </svg>
</a>
