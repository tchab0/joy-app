{% comment %}
Vignettes YouTube — attendre `videos` (liste de dicts youtube_videos()).
Optionnel: compact=True pour la barre latérale chat.
{% endcomment %}
{% if videos %}
<style>
  .rep-yt-thumbs {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: .65rem;
  }
  .rep-yt-card {
    position: relative;
    margin: 0;
    border-radius: var(--r);
    overflow: hidden;
    background: #111;
    aspect-ratio: 16 / 9;
  }
  .rep-yt-card__link {
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    color: #fff;
    text-decoration: none;
    min-height: 44px;
  }
  .rep-yt-card__img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .rep-yt-card__play {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 3.25rem;
    height: 3.25rem;
    border-radius: 50%;
    background: rgba(0, 0, 0, .55);
    border: 2px solid rgba(255, 255, 255, .9);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
    pointer-events: none;
  }
  .rep-yt-card__play::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 54%;
    transform: translate(-50%, -50%);
    border-style: solid;
    border-width: .55rem 0 .55rem .9rem;
    border-color: transparent transparent transparent #fff;
  }
  .rep-yt-card__label {
    position: absolute;
    left: .55rem;
    bottom: .45rem;
    padding: .2rem .45rem;
    border-radius: calc(var(--r) * .6);
    background: rgba(0, 0, 0, .55);
    color: #fff;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .rep-yt-card__link:hover .rep-yt-card__play,
  .rep-yt-card__link:focus-visible .rep-yt-card__play {
    background: var(--accent);
    border-color: #fff;
  }
  .rep-yt-card__link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .rep-yt-card__player {
    position: absolute;
    inset: 0;
    background: #000;
  }
  .rep-yt-card__player iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .rep-yt-thumbs--compact {
    gap: .5rem;
  }
  .rep-yt-thumbs--compact .rep-yt-card__play {
    width: 2.5rem;
    height: 2.5rem;
  }
  .rep-yt-thumbs--compact .rep-yt-card__play::before {
    border-width: .4rem 0 .4rem .65rem;
  }
  @media (min-width: 560px) {
    .rep-yt-thumbs:not(.rep-yt-thumbs--compact) {
      grid-template-columns: repeat(3, 1fr);
      gap: .75rem;
    }
  }
</style>
<ul class="rep-yt-thumbs{% if compact %} rep-yt-thumbs--compact{% endif %}" role="list">
  {% for v in videos %}
  <li class="rep-yt-card" data-yt-id="{{ v.id }}">
    <a
      class="rep-yt-card__link"
      href="{{ v.url }}"
      target="_blank"
      rel="noopener noreferrer"
      data-yt-embed="{{ v.embed }}"
      aria-label="{{ v.label }} — ouvrir sur YouTube"
    >
      <img
        class="rep-yt-card__img"
        src="{{ v.thumbnail }}"
        alt=""
        width="480"
        height="360"
        loading="lazy"
        decoding="async"
      >
      <span class="rep-yt-card__play" aria-hidden="true"></span>
      <span class="rep-yt-card__label">{{ v.label }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
<script>
(function () {
  document.querySelectorAll(".rep-yt-card__link[data-yt-embed]").forEach(function (link) {
    if (link.dataset.ytBound) return;
    link.dataset.ytBound = "1";
    link.addEventListener("click", function (e) {
      var embed = link.getAttribute("data-yt-embed");
      if (!embed) return;
      e.preventDefault();
      var card = link.closest(".rep-yt-card");
      if (!card || card.classList.contains("is-playing")) return;
      card.classList.add("is-playing");
      var wrap = document.createElement("div");
      wrap.className = "rep-yt-card__player";
      var iframe = document.createElement("iframe");
      iframe.src = embed + (embed.indexOf("?") >= 0 ? "&" : "?") + "autoplay=1";
      iframe.title = link.getAttribute("aria-label") || "YouTube";
      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.loading = "eager";
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      wrap.appendChild(iframe);
      card.replaceChildren(wrap);
    });
  });
})();
</script>
{% endif %}
