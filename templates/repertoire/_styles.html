{% comment %}Styles répertoire — s’appuie sur planning/_styles.html{% endcomment %}
<style>
  .rep-filter {
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    margin-bottom: 1.25rem;
  }
  .rep-filter label {
    font-size: .75rem; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
  }
  .pl-input, .rep-filter select {
    font: inherit; font-size: .9rem; color: var(--text);
    padding: .55rem .75rem; border: 1px solid var(--border);
    border-radius: var(--r); background: var(--surface);
    min-height: 44px; width: 100%; max-width: 100%;
  }
  .rep-filter select { max-width: 18rem; }
  .rep-block {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 1rem 1.1rem; margin-bottom: 1rem;
  }
  .rep-block h2, .rep-block h3 {
    font-family: var(--font-d); font-size: 1.1rem; margin: 0 0 .5rem;
  }
  .rep-block p, .rep-block pre {
    margin: 0; color: var(--text); font-size: .9rem; white-space: pre-wrap;
    font-family: var(--font-b); line-height: 1.45;
  }
  .rep-muted { color: var(--muted); font-size: .85rem; }
  .rep-part-list { list-style: none; padding: 0; margin: 0; }
  .rep-part-list li {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; padding: .75rem 0; border-bottom: 1px solid var(--border);
    min-height: 44px;
  }
  .rep-part-list li:last-child { border-bottom: none; }
  .rep-part-list a {
    color: var(--accent); font-weight: 600; text-decoration: none;
    padding: .5rem 0; min-height: 44px; display: inline-flex; align-items: center;
  }
  .rep-part-list a:hover { color: var(--accent-h); }
  .rep-form-stack { display: flex; flex-direction: column; gap: .75rem; max-width: 36rem; }
  .rep-form-stack label {
    display: block; font-size: .8rem; font-weight: 600; color: var(--muted);
    margin-bottom: .25rem;
  }
  .rep-form-actions {
    display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem;
  }
  .rep-form-actions .pl-btn { min-height: 44px; padding: .55rem 1rem; }
  .rep-audio {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 2.75rem;
    margin: .25rem 0 0;
  }
  /* Vignettes YouTube — voir repertoire/_youtube_thumbs.html */
  .chat-piece-intro {
    margin: 0 0 .75rem; padding: .85rem 1rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); color: var(--text);
  }
  .chat-piece-intro h2 {
    font-family: var(--font-d); font-size: 1rem; margin: 0 0 .4rem;
  }
  .chat-piece-intro p, .chat-piece-intro pre {
    margin: 0; font-size: .85rem; white-space: pre-wrap; line-height: 1.4;
  }
  .chat-piece-intro__link {
    display: inline-block; margin-top: .65rem; color: var(--accent);
    font-weight: 600; font-size: .85rem; text-decoration: none;
    min-height: 44px; line-height: 44px;
  }

  /* Setlist builder — mobile-first dual pane */
  .pl--wide { max-width: 1100px; }
  .rep-form-stack--wide { max-width: 36rem; }
  .rep-sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .rep-setlist-form { margin-top: .25rem; }
  .rep-builder {
    display: flex; flex-direction: column; gap: 1rem;
    margin: 1.5rem 0 0;
  }
  .rep-builder__pane {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: .85rem .85rem 0;
    display: flex; flex-direction: column; min-height: 16rem;
    color: var(--text);
  }
  .rep-builder__pane--setlist {
    border-color: rgba(var(--accent-rgb), .35);
  }
  .rep-builder__pane-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: .75rem; margin-bottom: .65rem;
  }
  .rep-builder__pane-head h2 {
    font-family: var(--font-d); font-size: 1.15rem; margin: 0; color: var(--text);
  }
  .rep-builder__hint {
    margin: -.25rem 0 .65rem; font-size: .8rem;
  }
  .rep-builder__filters {
    display: flex; flex-direction: column; gap: .5rem; margin-bottom: .65rem;
  }
  .rep-letter-bar {
    display: flex; flex-wrap: wrap; gap: .3rem;
  }
  .rep-letter {
    appearance: none; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font: inherit; font-size: .75rem; font-weight: 600;
    min-width: 2.25rem; min-height: 2.25rem; padding: .25rem .4rem;
    border-radius: var(--r); cursor: pointer;
    transition: background var(--trans), border-color var(--trans), color var(--trans);
  }
  .rep-letter:hover { border-color: var(--text); }
  .rep-letter.is-active {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .rep-builder__list {
    list-style: none; margin: 0 -.85rem 0; padding: 0;
    flex: 1; max-height: min(55vh, 28rem); overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .rep-builder__list--set.is-drag-over {
    background: rgba(var(--accent-rgb), .06);
  }
  .rep-builder__item {
    display: flex; align-items: center; gap: .5rem;
    padding: .55rem .85rem; min-height: 48px;
    border-top: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    cursor: grab; user-select: none; touch-action: manipulation;
  }
  .rep-builder__item:active { cursor: grabbing; }
  .rep-builder__item.is-dragging { opacity: .45; }
  .rep-builder__item--set {
    align-items: flex-start; padding-top: .65rem; padding-bottom: .65rem;
  }
  .rep-builder__handle {
    color: var(--muted); font-size: .7rem; letter-spacing: -.05em;
    line-height: 1; flex-shrink: 0; padding-top: .15rem;
  }
  .rep-builder__pos {
    font-size: .75rem; font-weight: 700; color: var(--gold-text);
    min-width: 1.25rem; flex-shrink: 0; padding-top: .2rem;
  }
  .rep-builder__body {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .35rem;
  }
  .rep-builder__title {
    font-weight: 600; font-size: .92rem; color: var(--text);
    line-height: 1.3; word-break: break-word;
  }
  .rep-builder__note {
    font-size: .8rem !important; min-height: 40px !important;
    padding: .4rem .55rem !important;
  }
  .rep-builder__action {
    appearance: none; flex-shrink: 0;
    width: 44px; height: 44px; border-radius: var(--r);
    border: 1.5px solid var(--border); background: var(--bg);
    color: var(--accent); font-size: 1.35rem; font-weight: 600;
    line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--trans), border-color var(--trans), color var(--trans);
  }
  .rep-builder__action:hover {
    border-color: var(--accent); background: rgba(var(--accent-rgb), .08);
  }
  .rep-builder__action--remove {
    color: var(--muted); font-size: 1.5rem; font-weight: 400;
  }
  .rep-builder__action--remove:hover {
    color: var(--accent); border-color: var(--accent);
  }
  .rep-builder__empty {
    padding: 1.25rem .85rem; text-align: center;
    color: var(--muted); font-size: .9rem; border-top: 1px solid var(--border);
  }
  .rep-setlist-hidden { display: none; }
  [x-cloak] { display: none !important; }

  @media (min-width: 800px) {
    .rep-builder {
      flex-direction: row; align-items: stretch; gap: 1.25rem;
    }
    .rep-builder__pane {
      flex: 1; min-width: 0; min-height: 24rem;
    }
    .rep-builder__list {
      max-height: min(70vh, 36rem);
    }
  }
</style>
