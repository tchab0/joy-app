# Nextcloud minimal — partitions JOY pour MobileSheets
# Données hors git : /srv/jazz-orchestra-yonnais/data/nextcloud/
#
# Démarrage : sudo bash deploy/nextcloud/install.sh

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nextcloud
    volumes:
      - /srv/jazz-orchestra-yonnais/data/nextcloud/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    image: nextcloud:31-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-cloud.jazz-orchestra-yonnais.fr}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${OVERWRITEHOST:-cloud.jazz-orchestra-yonnais.fr}
      OVERWRITECLIURL: ${OVERWRITECLIURL:-https://cloud.jazz-orchestra-yonnais.fr}
    volumes:
      - /srv/jazz-orchestra-yonnais/data/nextcloud/html:/var/www/html
      # Arborescence PDF exportée depuis Django (stable pour MobileSheets)
      - /srv/jazz-orchestra-yonnais/data/nextcloud/scores:/mnt/joy-scores:rw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r 'exit(@file_get_contents(\"http://127.0.0.1/status.php\")===false?1:0);'",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
