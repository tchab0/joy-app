# Include from http{} — e.g. /etc/nginx/conf.d/http-perf.conf
# Fluidité : types compressés (gzip on est déjà dans nginx.conf).
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;
